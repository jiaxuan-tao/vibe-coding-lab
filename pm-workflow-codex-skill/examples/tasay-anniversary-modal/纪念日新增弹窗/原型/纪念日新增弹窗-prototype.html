<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纪念日新增弹窗｜隔离演示原型</title>
<style>
:root{--accent:#5b5bd6;--ink:#1f2937;--muted:#6b7280;--line:#e6e8f0;--bg:#f7f8fc;--danger:#c2384d;--danger-bg:#fff1f3;--success:#16845b;--success-bg:#edfaf4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;color:var(--ink)}
.gallery{display:grid;gap:28px;justify-content:center;padding:32px 20px 80px}.device-wrapper{display:flex;justify-content:center}.device{width:430px;min-height:760px;background:#fff;border:1px solid #e2e4ee;border-radius:22px;box-shadow:0 18px 48px rgba(42,43,99,.12);overflow:hidden;position:relative}.device-label{font-size:13px;color:var(--muted);text-align:center;margin:0 0 8px}
.appbar{height:70px;padding:24px 24px 0;background:#fff;border-bottom:1px solid #f0f1f5;font-weight:800}.content{padding:22px 24px}.list-title{display:flex;justify-content:space-between;align-items:center}.list-title h1{font-size:20px;margin:0}.add-btn{border:0;border-radius:9px;padding:9px 13px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.record{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.record b{font-size:15px}.record span{font-size:13px;color:var(--muted)}
.overlay{position:absolute;inset:0;background:rgba(25,28,45,.36);display:flex;align-items:flex-end;padding:16px}.modal{width:100%;background:#fff;border-radius:17px;padding:22px;box-shadow:0 12px 28px rgba(15,17,34,.22)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal h2{font-size:19px;margin:0}.close{border:0;background:transparent;color:#8890a3;font-size:23px;line-height:1;cursor:pointer}.field{margin-top:14px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}.field input{width:100%;border:1px solid #ccd1df;border-radius:9px;padding:11px 12px;color:var(--ink);font:inherit;outline:0}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,214,.12)}.field input.error{border-color:var(--danger);background:#fffafb}.hint{margin:6px 0 0;color:var(--danger);font-size:12px;min-height:17px}.api-error{display:none;margin:14px 0 0;padding:10px 11px;border:1px solid #fac7cf;border-radius:8px;background:var(--danger-bg);color:#9e243a;font-size:13px;line-height:1.5}.api-error.show{display:block}.simulator{display:flex;align-items:center;gap:8px;margin-top:13px;color:var(--muted);font-size:12px}.simulator input{accent-color:var(--accent)}.actions{display:flex;gap:10px;margin-top:20px}.secondary,.primary{flex:1;border-radius:9px;padding:11px;border:0;font-weight:700;cursor:pointer}.secondary{background:#f0f1f6;color:#4a5060}.primary{background:var(--accent);color:#fff}.primary:disabled{opacity:.65;cursor:wait}.toast{position:absolute;left:20px;right:20px;bottom:20px;padding:11px 12px;border-radius:9px;background:#22243c;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.toast.success{background:var(--success)}.state-note{margin:14px 20px 0;padding:10px 12px;border-radius:9px;background:#eef0ff;color:#3f438c;font-size:12px;line-height:1.5}.history-note{margin-top:20px;padding:12px;border-radius:10px;background:var(--success-bg);color:var(--success);font-size:13px}
body.tiled .gallery{grid-template-columns:repeat(auto-fit,minmax(450px,1fr);align-items:start}body.tiled .device-wrapper{display:flex}body:not(.tiled) .gallery{display:block;padding:24px 20px 48px}body:not(.tiled) .device-wrapper{display:none}body:not(.tiled) .device-wrapper.active{display:flex}.page-title{font-size:14px;font-weight:800;color:#40436e;text-align:center;margin:0 0 10px}
</style>
</head>
<body>
<main class="gallery" id="gallery">
  <section class="device-wrapper" data-page="form"><div><p class="device-label">P1 · 新增弹窗（默认与可操作演示）</p><div class="device" id="form"></div></div></section>
  <section class="device-wrapper" data-page="name-empty"><div><p class="device-label">P2 · 名称为空</p><div class="device" id="name-empty"></div></div></section>
  <section class="device-wrapper" data-page="date-empty"><div><p class="device-label">P3 · 日期为空</p><div class="device" id="date-empty"></div></div></section>
  <section class="device-wrapper" data-page="date-invalid"><div><p class="device-label">P4 · 日期非法</p><div class="device" id="date-invalid"></div></div></section>
  <section class="device-wrapper" data-page="api-failure"><div><p class="device-label">P5 · 保存接口失败（输入保留）</p><div class="device" id="api-failure"></div></div></section>
  <section class="device-wrapper" data-page="success"><div><p class="device-label">P6 · 保存成功（弹窗关闭并刷新列表）</p><div class="device" id="success"></div></div></section>
</main>
<script>
const demoRecord={name:'年度纪念日',date:'2026-10-01'};
function baseList(extra=''){return `<div class="appbar">知伴 · 纪念日</div><div class="content"><div class="list-title"><h1>我的纪念日</h1><button class="add-btn" type="button" onclick="openDemo(this)">新增</button></div><div class="record"><div><b>相识纪念日</b><br><span>2024-05-20</span></div><span>已保存</span></div>${extra}</div>`}
function field(label,name,prefix,value='',placeholder='',error=''){const id=`${prefix}-${name}`;return `<div class="field"><label for="${id}">${label}</label><input id="${id}" data-field="${name}" class="${error?'error':''}" value="${value}" placeholder="${placeholder}" autocomplete="off"><p class="hint" data-error-for="${name}">${error}</p></div>`}
function modal({name='',date='',nameError='',dateError='',apiError='',saving=false,withDemo=true,prefix='form'}={}){return `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="新增纪念日"><div class="modal-head"><h2>新增纪念日</h2><button class="close" type="button" onclick="closeDemo(this)" aria-label="关闭">×</button></div>${field('名称','name',prefix,name,'例如：相识纪念日',nameError)}${field('日期','date',prefix,date,'YYYY-MM-DD',dateError)}<div class="api-error ${apiError?'show':''}" data-role="api-error" role="alert">${apiError}</div>${withDemo?'<label class="simulator"><input data-role="simulate-failure" type="checkbox"> 演示：下一次保存失败（仅隔离原型）</label>':''}<div class="actions"><button class="secondary" type="button" onclick="closeDemo(this)">取消</button><button class="primary" data-role="save" type="button" onclick="saveDemo(this)" ${saving?'disabled':''}>${saving?'保存中…':'保存'}</button></div></section></div>`}
function renderStatic(){document.getElementById('form').innerHTML=baseList()+modal({prefix:'form'});document.getElementById('name-empty').innerHTML=baseList()+modal({prefix:'name-empty',date:'2026-10-01',nameError:'请填写名称',withDemo:false});document.getElementById('date-empty').innerHTML=baseList()+modal({prefix:'date-empty',name:'年度纪念日',dateError:'请选择日期',withDemo:false});document.getElementById('date-invalid').innerHTML=baseList()+modal({prefix:'date-invalid',name:'年度纪念日',date:'2026-02-30',dateError:'请输入有效日期（YYYY-MM-DD）',withDemo:false});document.getElementById('api-failure').innerHTML=baseList()+modal({prefix:'api-failure',name:'年度纪念日',date:'2026-10-01',apiError:'保存失败，请检查网络后重试。已填写内容已保留。',withDemo:false});document.getElementById('success').innerHTML=baseList(`<div class="record"><div><b>${demoRecord.name}</b><br><span>${demoRecord.date}</span></div><span>已保存</span></div><div class="history-note">保存成功：弹窗已关闭，列表已刷新（隔离演示）。</div>`)}
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number),x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d}
function clearError(modalElement,name){const input=modalElement.querySelector(`[data-field="${name}"]`),hint=modalElement.querySelector(`[data-error-for="${name}"]`);if(input){input.classList.remove('error');hint.textContent=''}}
function openDemo(trigger){const dev=trigger?.closest('.device')||document.getElementById('form');dev.innerHTML=baseList()+modal({prefix:dev.id})}
function closeDemo(trigger){const dev=trigger?.closest('.device')||document.getElementById('form');dev.innerHTML=baseList()}
function saveDemo(button){const modalElement=button.closest('.modal'),dev=button.closest('.device');if(!modalElement||!dev)return;const name=modalElement.querySelector('[data-field="name"]'),date=modalElement.querySelector('[data-field="date"]');if(!name||!date)return;clearError(modalElement,'name');clearError(modalElement,'date');const api=modalElement.querySelector('[data-role="api-error"]');api.classList.remove('show');let bad=false;if(!name.value.trim()){name.classList.add('error');modalElement.querySelector('[data-error-for="name"]').textContent='请填写名称';bad=true}if(!date.value.trim()){date.classList.add('error');modalElement.querySelector('[data-error-for="date"]').textContent='请选择日期';bad=true}else if(!validDate(date.value.trim())){date.classList.add('error');modalElement.querySelector('[data-error-for="date"]').textContent='请输入有效日期（YYYY-MM-DD）';bad=true}if(bad)return;button.disabled=true;button.textContent='保存中…';const shouldFail=modalElement.querySelector('[data-role="simulate-failure"]')?.checked;setTimeout(()=>{if(shouldFail){button.disabled=false;button.textContent='保存';api.textContent='保存失败，请检查网络后重试。已填写内容已保留。';api.classList.add('show');return}dev.innerHTML=baseList(`<div class="record"><div><b>${escapeHtml(name.value.trim())}</b><br><span>${escapeHtml(date.value.trim())}</span></div><span>已保存</span></div><div class="history-note">保存成功：弹窗已关闭，列表已刷新（隔离演示）。</div>`)+`<div class="toast success">保存成功</div>`},420)}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showPage(page){document.querySelectorAll('.device-wrapper').forEach(w=>w.classList.toggle('active',w.dataset.page===page));window.parent.postMessage({type:'page-changed',page},'*')}
function init(){renderStatic();const page=(location.hash||'#form').slice(1);if(location.hash){document.body.classList.remove('tiled');showPage(document.querySelector(`[data-page="${page}"]`)?page:'form')}else{document.body.classList.add('tiled')}}
window.addEventListener('hashchange',init);init();
window.addEventListener('message',e=>{if(e.data&&e.data.type==='navigate'){location.hash=e.data.page}});
</script>
</body>
</html>
